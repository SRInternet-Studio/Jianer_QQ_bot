<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Jianer Bot</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #8a2be2;
            --secondary: #4169e1;
            --accent: #ff1493;
            --bg-color: #0f0c29;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.7);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
            background-color: var(--bg-color);
            background-image: url('../assets/bg.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 2;
            width: 800px;
            padding: 3rem;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* Header Section */
        .header {
            text-align: center;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .title {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, #fff 0%, #a8b8d8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.25rem;
            font-weight: 300;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* Info Section */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        .info-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .info-item:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.08);
        }

        .info-label {
            font-size: 0.85rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .info-value {
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--text-main);
        }

        /* Footer Section */
        .footer {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .copyright {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 400;
            letter-spacing: 0.05em;
        }
        
        /* Decorative Elements */
        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 10px var(--accent);
        }

    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">{{bot_name}} {{bot_name_en}}</h1>
            <p class="subtitle">{{ONE_SLOGAN}}</p>
        </header>

        <main class="info-grid">
            <div class="info-item">
                <div class="info-label"><span class="dot"></span>构建信息 (Build Info)</div>
                <div class="info-value">{{version_name}}</div>
            </div>
            
            <div class="info-item">
                <div class="info-label"><span class="dot" style="background: var(--secondary); box-shadow: 0 0 10px var(--secondary);"></span>驱动核心 (Driver Core)</div>
                <div class="info-value">由 {{app_name}} {{protocol_version}}-{{app_version}} 驱动</div>
            </div>

            <div class="info-item">
                <div class="info-label"><span class="dot" style="background: var(--primary); box-shadow: 0 0 10px var(--primary);"></span>底层架构 (Base Framework)</div>
                <div class="info-value">基于 HypeR Bot by HarcicYang 版本 0.81.2 开发</div>
            </div>
        </main>

        <footer class="footer">
            <div class="copyright">jianer.sr-studio.cn &copy; 2019~{{year}} SR思锐团队 保留所有权利</div>
        </footer>
    </div>
</body>
</html>
