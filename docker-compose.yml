services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: jianer-bot:local
    container_name: jianer-bot
    working_dir: /app
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Shanghai
    volumes:
      - ./:/app
    command: ["python", "main.py"]

  webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: jianer-bot:local
    container_name: jianer-webui
    working_dir: /app
    restart: unless-stopped
    profiles:
      - webui
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Shanghai
      WEBUI_PORT: ${WEBUI_PORT:-5000}
    volumes:
      - ./:/app
    ports:
      - "${WEBUI_PORT:-5000}:${WEBUI_PORT:-5000}"
    command: ["python", "app.py"]
